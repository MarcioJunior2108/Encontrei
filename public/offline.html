<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Você está offline | Encontrei</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #FAFAFA;
      color: #171717;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0A0A0A;
        color: #EDEDED;
      }
    }
    h1 { margin-top: 1.5rem; margin-bottom: 0.5rem; font-size: 1.5rem; font-weight: 700; }
    p { margin-top: 0; color: #737373; font-size: 0.875rem; max-width: 300px; }
    button {
      margin-top: 1.5rem;
      background-color: #2563EB;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background-color: #1D4ED8; }
  </style>
</head>
<body>
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 2l20 20"></path>
    <path d="M8.5 8.5C10 7.7 11.7 7.3 13.5 7.4"></path>
    <path d="M5 12c1.2-1.2 2.8-2 4.5-2.4"></path>
    <path d="M16.5 12.5C17.7 13.1 18.7 14 19.5 15"></path>
    <path d="M13 18.3c1.3.4 2.5 1 3.5 1.7"></path>
    <circle cx="12" cy="20" r="1"></circle>
  </svg>
  <h1>Sem conexão à internet</h1>
  <p>Parece que você está offline. Verifique sua conexão e tente novamente.</p>
  <button onclick="window.location.reload()">Tentar novamente</button>
</body>
</html>
